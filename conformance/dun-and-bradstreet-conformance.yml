  source: https://www.dnb.com/en-us/utilities/our-security.html
  program:
    - name: SOC 2 Type 2
      status: attested annually
      evidence: >-
        "independent auditor certify a SOC2 Type 2 attestation annually,
        demonstrating operational effectiveness of controls (available under
        mutual NDA)"
      report_availability: under mutual NDA
    - name: SOC 3
      status: referenced
      evidence: >-
        Named in D&B's data-transparency material alongside SOC 2 Type 2.
    - name: ISO/IEC 27001:2022
      status: certified annually, multiple locations
      evidence: >-
        "D&B also annually certifies to the ISO/IEC 27001:2022 Information
        Security Management Systems (ISMS) standard at multiple locations"
    - name: ISO/IEC 27701
      status: certified where ISO 27001 is certified
      evidence: >-
        "In markets in which they are certified as compliant with ISO 27001
        ... they also hold an ISO 27701 certification (Privacy Information
        Management Systems)"
    - name: PCI DSS
      status: assessed annually
      evidence: '"D&B annually undergoes PCI and SIG assessments"'
    - name: SIG (Standardized Information Gathering)
      status: assessed annually
      evidence: '"D&B annually undergoes PCI and SIG assessments"'
    - name: ISO 22301
      status: referenced (business continuity)
      source: https://www.dnb.com/en-us/why-dnb/data-transparency/operational-resilience.html
    - name: HIPAA
      status: referenced
      source: https://www.dnb.com/en-us/why-dnb/data-transparency/operational-resilience.html
  regulatory_frameworks:
    - name: DORA (EU Digital Operational Resilience Act)
      source: https://www.dnb.com/en-us/why-dnb/data-transparency/operational-resilience.html
    - name: GDPR
      source: https://www.dnb.com/en-us/why-dnb/data-transparency/data-compliance.html
    - name: FTC Consent Order
      source: https://www.dnb.com/en-us/why-dnb/data-transparency/operational-resilience.html
  detail: security/dun-and-bradstreet-trust-center.yml

absences:
  - >-
    No certification is scoped to the Direct+ API specifically; the program is
    corporate.
  - No public attestation reports — SOC 2 is NDA-gated.
