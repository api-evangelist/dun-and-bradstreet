absences:
  - >-
    The Data Block catalogue (block IDs, versions, levels and the attributes
    inside each) is the largest part of D&B's real data model and is published
    only inside the Okta-gated documentation portal, so it cannot be modelled
    here beyond the block families the Enrich schema names.
