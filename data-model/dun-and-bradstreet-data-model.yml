description: >-
  Entity-relationship graph for the D&B Direct+ API, derived from the
  components.schemas $ref graph and the id-reference fields in the harvested
  OpenAPI. Every entity, field and relationship below resolves to a schema or
  parameter that exists verbatim in the spec — nothing is inferred from the
  gated documentation portal.

primary_key:
  name: duns
  label: D-U-N-S Number
  type: string
  pattern: '^[0-9]{9}$'
  description: >-
    The nine-digit D-U-N-S Number is the join key for the entire Direct+
    surface. It is the output of Identity Resolution, the input to Enrich,
    Research and Monitoring membership, and the correlation key on every
    Monitoring notification. There are no other id prefixes or opaque object
    ids in this API — D&B's whole data model hangs off one global identifier.

entities:
  - name: Organization
    schema: OrganizationSummary
    description: A business entity in the D&B Data Cloud.
    identifier: duns
    fields: [duns, primaryName, primaryAddress, countryISOAlpha2Code, telephone, registrationNumbers]
    returned_by: [cleanseMatch, searchCompaniesByCriteria, searchContacts, getDataBlocksByDuns, multiProcessMatchAndEnrich]

  - name: Address
    schema: Address
    description: Structured postal address; embedded, never addressed on its own.
    fields: [streetAddress, addressLocality, addressRegion, postalCode, addressCountry]

  - name: MatchCandidate
    schema: MatchCandidate
    description: >-
      One ranked candidate returned by Identity Resolution, carrying the
      match-quality verdict alongside the organization.
    fields:
      - displaySequence
      - matchQualityInformation.confidenceCode
      - matchQualityInformation.matchGrade
      - matchQualityInformation.matchDataProfile
    returned_by: [cleanseMatch, multiProcessMatchAndEnrich]

  - name: DataBlock
    schema: null
    description: >-
      Not a declared schema — a licensed slice of the organization payload
      selected by the blockIDs parameter. The Enrich response models the
      block families as sub-objects (corporateLinkage, financials, principals,
      beneficialOwnership, riskAssessment).
    identifier: blockID
    selected_by: [getDataBlocksByDuns, multiProcessMatchAndEnrich, createMonitoringRegistration]

  - name: Contact
    schema: 'ContactSearchResponse.searchCandidates[].contact'
    description: A named person associated with an organization.
    fields:
      - fullName
      - 'jobTitles[].title'
    returned_by: [searchContacts]

  - name: MonitoringRegistration
    schema: MonitoringRegistrationRequest / MonitoringRegistrationResponse
    description: >-
      A named portfolio of D-U-N-S Numbers watched for change, with a chosen
      delivery method.
    identifier: registrationReference
    fields: [registrationReference, description, blockIDs, deliveryMethod, status, createdTimestamp]
    delivery_methods: [SFTP, API_PULL]
    returned_by: [createMonitoringRegistration]

  - name: PortfolioMembership
    schema: PortfolioMembershipRequest / PortfolioMembershipResponse
    description: The set of D-U-N-S Numbers inside a MonitoringRegistration.
    fields:
      - dunsList
      - addedQuantity
      - removedQuantity
      - 'rejectedDuns[].duns'
      - 'rejectedDuns[].reason'
    returned_by: [addDunsToRegistration, removeDunsFromRegistration]

  - name: MonitoringNotification
    schema: 'MonitoringNotificationsResponse.notifications[]'
    description: >-
      A single field-level change event on a monitored organization, carrying
      the before and after values.
    fields: [duns, changeTimestamp, blockID, elementId, previousValue, currentValue]
    returned_by: [pullMonitoringNotifications]

  - name: BatchFile
    schema: BatchFileSubmission / BatchSubmissionResponse / BatchStatusResponse
    description: An asynchronous bulk match/enrich job.
    identifier: fileId
    fields: [fileId, processId, productId, status, submissionTimestamp, processedRecordCount, totalRecordCount]
    status_values: [PENDING, PROCESSING, COMPLETED, FAILED]
    returned_by: [submitBatchFile, getBatchFileStatus, downloadBatchFileResults]

  - name: AuditRecord
    schema: AuditResponse
    description: >-
      The verbatim response D&B previously returned for a given D-U-N-S at a
      given timestamp — a replayable point-in-time record.
    fields: [duns, transactionTimestamp, originalResponse]
    returned_by: [getAuditRecord]

  - name: AccessToken
    schema: TokenRequest / TokenResponse
    description: Bearer JWT minted by the client_credentials exchange.
    fields: [grant_type, access_token, token_type, expirationDateTime]
    returned_by: [generateAccessToken]

  - name: TransactionDetail
    schema: TransactionDetail
    description: >-
      Correlation envelope attached to every response, success or error.
    fields: [transactionID, transactionTimestamp, inLanguage, serviceVersion]
    embedded_in: [MatchResponse, SearchResponse, ContactSearchResponse, EnrichResponse, MultiProcessResponse, Error]

