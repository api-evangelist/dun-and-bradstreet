core_flow:
  - step: resolve
    operation: cleanseMatch
    input: name + countryISOAlpha2Code (+ address, phone, registration number)
    output: duns
  - step: enrich
    operation: getDataBlocksByDuns
    input: duns + blockIDs
    output: licensed Data Block payload
  - step: watch
    operation: createMonitoringRegistration -> addDunsToRegistration
    input: duns
    output: change notifications
  - step: replay
    operation: getAuditRecord
    input: duns + transactionTimestamp
    output: the exact prior response

