  - date: '2026-07-30'
    type: breaking-change-notice
    title: EU B2B Gateway updates (CCDP) — Q3, effective 2026-09-11
    window_utc: 2026-07-30 00:01 - 2026-09-18 00:01 UTC
    products: [Comprehensive Customised Data Product (CCDP), EU B2B Gateway]
    breaking: true
    highlights:
      - >-
        UK and Ireland — the financial item "minority interest" moves from
        long-term liability to equity. The JSON path changes from
        .../Liabilities/NonCurrentLiabilities/MinorityInterest to
        .../Liabilities/Equity/MinorityInterest.
      - >-
        Total Long Term Liabilities and Total Liability decrease by the value
        of minority interests; Net Worth, Total Equity and Tangible Net Worth
        increase by it.
      - >-
        Ratio values change — ShareholdersReturn, FixedAssetsToNetWorth,
        CurrentLiabilitiesToNetWorth.
      - >-
        UK — Companies House moves from batch files to an API, changing
        RecordPayload/PublicFilings/MortgagesandCharges/... content:
        ChargeHoldersInformationEntry/Name and AdditionalDetailsEntry/DetailText
        change from upper case to mixed case; ChargeAmount loses decimal
        places; ChargeAmount/ISOCurrencyCode will remain empty.
      - Customers monitoring UK/IE businesses should expect more monitoring notifications.
    breaking_note: >-
      This is a payload-shape change to a delivered data product. It is
      announced on the status page rather than in a developer changelog,
      which is the notable finding: D&B's only public breaking-change channel
      is its operational status dashboard.
    source: https://status.dnb.com/

