generated: '2026-08-13'
method: searched
source: https://status.dnb.com/
description: >-
  Versioning, deprecation, availability and status posture for the D&B
  Direct+ API. The status page is public and real. The versioning scheme is
  derived from the OpenAPI path structure. The deprecation policy and change
  history live inside the Okta-gated Direct+ documentation portal and could
  not be read anonymously, so no deprecation policy is asserted.

versioning:
  scheme: uri-path
  current: per-product
  detail: >-
    Direct+ versions each product independently in the path rather than
    versioning the platform. A single integration calls /v1 (match, search,
    data, multiProcess, file, monitoring), /v2 (audit) and /v3 (token)
    simultaneously. There is no version header and no date-based version
    train.
  observed_versions:
    v1: 12 operations
    v2: 1 operation (getAuditRecord)
    v3: 1 operation (generateAccessToken)
  source: openapi/_original/dnb-direct-plus-openapi-original.yml
  data_block_versioning: >-
    Data Blocks carry their own version and level inside the blockIDs
    parameter, so payload shape evolves independently of the path version.
  docs: https://directplus.documentation.dnb.com/html/resources/ChangeHistory.html
  docs_status: 302 -> https://directplus.documentation.dnb.com/oauth2/authorization/okta

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: unknown
  deprecation_header: unknown
  note: >-
    No deprecation or sunset policy is anonymously readable. RFC 8594
    Sunset/Deprecation header support could not be observed on unauthenticated
    responses. The Direct+ Change History page, which is where D&B announces
    retirements, 302s into Okta sign-in. NOT recorded as absent — recorded as
    unverifiable, and therefore NO Deprecation pointer is emitted in apis.yml.

deprecated_operations: []
