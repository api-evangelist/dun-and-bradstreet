name: Dun & Bradstreet Plans & Pricing
description: >-
  Commercial offering for D&B Direct+ and the broader Dun & Bradstreet data
  product suite. Direct+ is sold exclusively as a contracted subscription;
  Dun & Bradstreet does not publish a self-service pricing page or
  pay-as-you-go credit card tier. Pricing is negotiated per customer based
  on the data blocks subscribed to, transaction volume, monitored portfolio
  size, and geographic coverage.
specificationVersion: API Commons Plans 0.1
