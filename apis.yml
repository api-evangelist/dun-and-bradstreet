apis:
- name: D&B Risk Analytics MCP Server
  description: >-
    Dun & Bradstreet's remote Model Context Protocol server for D&B Risk
    Analytics, exposing KYC/KYB onboarding, entity resolution, sanctions and
    adverse-media screening, alert triage and risk decision documentation to
    MCP-compatible agents over Streamable HTTP. Confirmed live: the endpoint
    answers an unauthenticated tools/list with HTTP 401 invalid_token and
    publishes RFC 9728 protected-resource metadata plus an RFC 8414
    authorization server with mcp.read / mcp.write scopes. The tool list
    itself requires an authenticated session.
  humanURL: https://www.dnb.com/en-us/solutions/artificial-intelligence/connectors/dnb-mcp.html
  baseURL: https://agents.riskanalytics.dnb.com
  tags:
    - MCP
    - Agents
    - Risk
    - Compliance
    - KYB
  properties:
