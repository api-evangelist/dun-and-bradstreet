- aid: dun-and-bradstreet:direct-plus-identity-resolution
  name: D&B Direct+ Identity Resolution API
  description: >-
    The Identity Resolution surface of D&B Direct+ matches an input business record — name, address, phone,
    email, registration number — to a single authoritative D-U-N-S Number. The API returns ranked candidate
    matches with confidence and match-grade indicators so applications can either auto-accept the top
    result above a configured threshold or surface candidates for manual review. This is the canonical
    entry point for master-data-management and customer-onboarding workflows because it converts noisy
    free-text input into a stable D&B identifier.
  humanURL: https://directplus.documentation.dnb.com/html/guides/IdentityResolution.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Identity Resolution
  - Match
  - D-U-N-S Number
  - Onboarding
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/IdentityResolution.html
- aid: dun-and-bradstreet:direct-plus-search
  name: D&B Direct+ Search API
  description: >-
    The Search surface of D&B Direct+ lets applications find businesses, principals, and related entities
    using flexible criteria such as company name, address, registration number, beneficial owner, or contact.
    It complements Identity Resolution by supporting browse-and-pick workflows where the user is exploring
    rather than asserting a single candidate record.
  humanURL: https://directplus.documentation.dnb.com/html/guides/Search.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Search
  - Company Data
  - Contacts
  - Discovery
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/Search.html
- aid: dun-and-bradstreet:direct-plus-enrich
  name: D&B Direct+ Enrich (Data Blocks) API
  description: >-
    The Enrich surface returns standardized "data blocks" for a given D-U-N-S Number. Blocks group attributes
    by domain — Company Information, Principals & Contacts, Hierarchy & Connections, Financial Strength
    & Payment, Third-Party Risk & Compliance, Beneficial Ownership, ESG Rankings, Diversity, and similar
    themes — and are versioned independently so consumers can opt into new attributes without breaking
    existing integrations. Enrich is the highest-volume Direct+ surface and is the preferred way to keep
    an internal customer or supplier record in sync with D&B's master data.
  humanURL: https://directplus.documentation.dnb.com/html/guides/EnrichmentGuide.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Enrichment
  - Data Blocks
  - Company Data
  - Financials
  - Risk
  - Compliance
  - Beneficial Ownership
  - ESG
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/EnrichmentGuide.html
- aid: dun-and-bradstreet:direct-plus-multi-process
  name: D&B Direct+ Multi-Process API
  description: >-
    Multi-Process combines Identity Resolution and Enrich into a single request: the caller submits a
    candidate input record plus a set of desired data blocks, D&B resolves the input to a D-U-N-S Number
    and returns the resolved entity together with all requested enrichment payloads. This eliminates a
    round-trip and is the recommended pattern for high-volume onboarding and CRM-augment workflows.
  humanURL: https://directplus.documentation.dnb.com/html/guides/MultiProcess.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Multi-Process
  - Match Plus Enrich
  - Onboarding
  - Automation
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/MultiProcess.html
- aid: dun-and-bradstreet:direct-plus-data-file
  name: D&B Direct+ Data File (Batch) API
  description: >-
    The Data File (Batch) surface lets customers submit large input files and receive matched, enriched
    output files asynchronously. The workflow is upload → process → poll status → download — suitable
    for nightly master-data refresh jobs, large supplier onboarding events, or one-time portfolio enrichment
    exercises where synchronous calls would be impractical.
  humanURL: https://directplus.documentation.dnb.com/html/guides/BatchUserGuide.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Batch
  - Data File
  - Asynchronous
  - Bulk
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/BatchUserGuide.html
- aid: dun-and-bradstreet:direct-plus-monitoring
  name: D&B Direct+ Monitoring API
  description: >-
    The Monitoring surface lets customers register a portfolio of D-U-N-S Numbers and subscribe to change
    events. When D&B detects an update to a monitored attribute — address, ownership, financials, risk
    rating, executives, business status — the change is delivered as a notification package (typically
    via SFTP pull file or webhook-style delivery) that downstream systems can replay to keep master data
    current. Monitoring is the streaming complement to Enrich's pull model.
  humanURL: https://directplus.documentation.dnb.com/html/guides/Monitoring.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Monitoring
  - Change Notifications
  - Event
  - Portfolio
  - Master Data
  tags_raw:
  - Monitoring
  - Change Notifications
  - Events
  - Portfolio
  - Master Data
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/Monitoring.html
- aid: dun-and-bradstreet:direct-plus-research
  name: D&B Direct+ Research API
  description: >-
    The Research surface lets customers retrieve historical responses Direct+ has previously returned,
    supporting audit, dispute, and reconciliation use cases where the application needs to see the exact
    data that was returned at a point in time rather than the current value.
  humanURL: https://directplus.documentation.dnb.com/html/guides/Research.html
  baseURL: https://plus.dnb.com
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  tags:
  - Research
  - Audit
  - Historical Data
  properties:
  - type: Documentation
    url: https://directplus.documentation.dnb.com/html/guides/Research.html
