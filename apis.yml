aid: dun-and-bradstreet
name: Dun & Bradstreet
description: >-
  Dun & Bradstreet is a leading global provider of business decisioning data and
  analytics, anchored by the D-U-N-S Number — a unique nine-digit identifier
  assigned to more than 500 million businesses worldwide. Founded in 1841 as
  The Mercantile Agency in New York City and now headquartered in Jacksonville,
  Florida, D&B operates the D&B Data Cloud, a master commercial database used
  by enterprises and governments for credit, risk, supply, master data, sales,
  marketing, compliance, and third-party due diligence. Its primary developer
  surface is D&B Direct+, a RESTful API platform that lets customers match,
  enrich, monitor, and stream company data programmatically using OAuth 2.0
  access tokens. D&B was taken private by Clearlake Capital in August 2025 for
  approximately $7.7 billion (including debt).
