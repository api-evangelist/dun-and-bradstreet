  - type: Features
    data:
      - name: D-U-N-S Number Identity
        description: >-
          Every business in the D&B Data Cloud carries a unique nine-digit
          D-U-N-S Number that acts as a persistent, globally recognized
          enterprise identifier.
      - name: Data Cloud Coverage
        description: >-
          More than 500 million company records spanning legal entities,
          branches, subsidiaries, contacts, and beneficial owners across
          virtually every country.
      - name: Data Blocks
        description: >-
          Versioned, domain-grouped attribute bundles (Company, Financials,
          Hierarchy, Risk, Compliance, ESG, Beneficial Ownership) that callers
          opt into per request.
      - name: Match + Enrich in One Call
        description: >-
          Multi-Process combines Identity Resolution and Enrich, eliminating
          a round-trip for onboarding and CRM-augment workflows.
      - name: Synchronous + Batch + Streaming
        description: >-
          Direct+ offers REST synchronous calls, Data File asynchronous batch
          processing, and Monitoring change-notification streams over the
          same data substrate.
      - name: Hierarchy and Linkage
        description: >-
          Corporate hierarchies — parent, headquarters, ultimate domestic
          parent, ultimate global parent, branches — are exposed as first-class
          relationships rather than denormalized fields.
      - name: Beneficial Ownership and Compliance
        description: >-
          Enrich includes UBO, sanctions, watchlist, and PEP screening data
          to support KYB, AML, and third-party risk management programs.
      - name: OAuth 2.0 Client Credentials
        description: >-
          Authentication is standard OAuth 2.0 client-credentials grant; bearer
          tokens are scoped per Direct+ subscription.
  - type: UseCases
    data:
      - name: Customer Onboarding (KYB)
        description: >-
          Resolve a prospective customer's name and address to a D-U-N-S
          Number, then enrich with financial, ownership, and compliance data
          before extending credit or signing a contract.
      - name: Supplier Master Data Management
        description: >-
          Use Multi-Process and Monitoring to keep an internal supplier master
          synchronized with D&B's authoritative company records, automatically
          flagging mergers, dissolutions, address changes, and ownership
          shifts.
      - name: Third-Party Risk Management
        description: >-
          Combine Enrich blocks for compliance, beneficial ownership, ESG, and
          financial stress to score third parties continuously against a
          policy.
      - name: Credit Decisioning
        description: >-
          Retrieve PAYDEX scores, financial-strength indicators, and trade
          payment history to automate credit limit decisions in lending and
          B2B trade.
      - name: Sales and Marketing Intelligence
        description: >-
          Search and Enrich power lead scoring, total-addressable-market
          modeling, and account-based marketing by attaching firmographic
          data to CRM records.
      - name: Compliance and Sanctions Screening
        description: >-
          Use compliance and beneficial-ownership blocks to satisfy AML, KYB,
          and sanctions-screening obligations.
      - name: Government and Grants Eligibility
        description: >-
          The D-U-N-S Number remains widely used as a registration identifier
          for procurement, grants, and supplier qualification programs.
  - type: Integrations
    data:
      - name: Salesforce
        description: >-
          D&B Hoovers and D&B Direct+ data flow into Salesforce CRM via D&B's
          managed packages and AppExchange listings.
      - name: Microsoft Dynamics 365
        description: >-
          Direct+ enrichment plugs into Dynamics 365 Sales and Customer
          Insights to augment accounts and contacts.
      - name: SAP
        description: >-
          D&B's master-data integrations enrich SAP S/4HANA and SAP Ariba
          supplier records with D-U-N-S Numbers and Data Blocks.
      - name: Oracle
        description: >-
          Direct+ data feeds Oracle ERP, EPM, and Procurement Cloud master
          data pipelines.
      - name: Snowflake Marketplace
        description: >-
          D&B publishes data products on the Snowflake Marketplace so
          customers can query Data Cloud attributes directly in their
          warehouse.
      - name: Adobe Real-Time CDP
        description: >-
          D&B firmographics enrich Adobe Real-Time CDP profiles for B2B
          personalization.
      - name: HubSpot
        description: >-
          Connectors push D&B Hoovers / Direct+ company data into HubSpot
          CRM properties.
  - type: Solutions
    data:
      - name: Finance & Credit
        description: >-
          Credit risk, accounts-receivable, trade payment, and collections
          solutions powered by Direct+ financial and risk blocks.
      - name: Sales & Marketing
        description: >-
          D&B Hoovers, Audience Targeting, and Connect for Salesforce build
          on Direct+ firmographics and contacts.
      - name: Third-Party Risk & Compliance
        description: >-
          D&B Risk Analytics, Beneficial Ownership, and Compliance Center
          combine enrichment and monitoring for vendor risk programs.
      - name: Master Data
        description: >-
          D&B Optimizer and master-data services use Direct+ to clean,
          deduplicate, and continuously synchronize enterprise customer and
          supplier records.
      - name: Supply
        description: >-
          Supplier intelligence, ESG, diversity, and supply-chain risk
          analytics combine Direct+ data blocks with D&B portfolio monitoring.
