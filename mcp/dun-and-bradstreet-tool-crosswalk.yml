description: >-
  Crosswalk between Dun & Bradstreet's agent-facing MCP surface and the
  machine-readable Direct+ REST contract in this repo. D&B ships two MCP
  servers but publishes no tools/list manifest for either — the Risk Analytics
  server's tools/list is OAuth-gated (probed 401) and the Commercial Graph /
  Direct+ server is distributed only through marketplace connectors whose
  single exposed action is a generic MCP passthrough (InvokeServer). Because
  no real tool NAMES exist on the open web, this crosswalk deliberately
  contains ZERO tool rows: fabricating tool names in order to bind them to
  operationIds would be inventing the exact thing the crosswalk is supposed to
  measure. What IS recorded is the D&B-published dataset surface, which
  capability it corresponds to on the REST side, and the full rest_only[] list
  — the honest measurement of where the two surfaces are known to diverge.

surfaces:
  openapi:
    file: openapi/_original/dnb-direct-plus-openapi-original.yml
    servers: [https://plus.dnb.com]
    operations: 14
    gated: false
    note: >-
      The spec is in this repo; the Direct+ reference documentation that
      backs it (directplus.documentation.dnb.com) 302s every page into Okta
      sign-in, so it is not anonymously readable.
  graphql:
    endpoint: null
    note: No GraphQL surface. POST https://plus.dnb.com/graphql returns 404.
  mcp:
    - url: https://agents.riskanalytics.dnb.com/mcp
      gated: true
      gate: OAuth 2.0 (RFC 9728 / RFC 8414 discovery served anonymously; tools/list returns 401 invalid_token)
    - url: null
      name: D&B MCP Server (Commercial Graph / Direct+)
      gated: true
      gate: Dplus-API-Key; endpoint URL unpublished, access via request form

crosswalk: []
crosswalk_note: >-
  Empty by design. See description — no MCP tool names are published, so
  there is nothing real to bind. This is a measured absence, not an omission.

mcp_only: []
mcp_only_note: >-
  The Risk Analytics server's documented capabilities (KYC/KYB onboarding,
  sanctions and adverse-media screening, alert triage, risk decision
  documentation) have no counterpart operation anywhere in the Direct+
  OpenAPI in this repo, and D&B publishes no REST contract for D&B Risk
  Analytics at all. They are therefore MCP-only capabilities in practice —
  but they are described in marketing prose, not named as tools, so they are
  recorded here as a note rather than as fabricated mcp_only[] rows.

