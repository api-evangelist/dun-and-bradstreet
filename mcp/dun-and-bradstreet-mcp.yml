absences:
  - No stdio / npx / npm / PyPI MCP package published by D&B.
  - No public tools/list manifest for either server.
  - No published endpoint URL for the Commercial Graph / Direct+ MCP server.
  - No A2A agent card on agents.riskanalytics.dnb.com or any other D&B host.
