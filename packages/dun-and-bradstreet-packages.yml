description: >-
  Client-library census for Dun & Bradstreet. THE HEADLINE FINDING IS A ZERO:
  Dun & Bradstreet publishes no first-party SDK in any public package
  registry, in any language. Its GitHub organization
  (github.com/Dun-and-Bradstreet, created 2017-12-12) exists but has zero
  public repositories. Everything below is third-party, and every one of them
  is abandoned — the most recently released was tagged in May 2024 with a
  single GitHub star, and the PHP wrapper's last release predates the Direct+
  platform entirely. A customer integrating Direct+ writes their own HTTP
  client.

official_sdk_count: 0
official_sdk_note: >-
  No SDKs pointer is emitted in apis.yml, because there are no official SDKs
  to point at. Emitting one would credit D&B with a developer surface it does
  not ship.

